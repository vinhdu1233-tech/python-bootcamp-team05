
name: Python Bootcamp CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  bootcamp:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install pytest ruff

      - name: Check Python code with Ruff
        run: ruff check .

      - name: Run Python Bootcamp tests
        shell: bash
        run: |
          if find tests -type f -name 'test_*.py' -print -quit | grep -q .; then
            python -m pytest -q .
          else
            echo "::notice::SKIPPED: Instructor tests not provided yet."
          fi
